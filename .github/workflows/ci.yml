name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Tests and notebooks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .

      - name: Run tests with coverage
        run: python -m pytest --cov --cov-report=term-missing --cov-fail-under=70

      - name: Execute notebooks
        run: >-
          python -m nbconvert --execute --to notebook --inplace
          notebooks/01_data_quality_and_features.ipynb
          notebooks/02_model_validation.ipynb
          --ExecutePreprocessor.timeout=300
