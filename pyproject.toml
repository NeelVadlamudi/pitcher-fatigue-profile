[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pitcher-fatigue"
version = "0.1.0"
description = "Statcast-based pitcher fatigue and pitch-quality degradation analysis."
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [{ name = "Neel Vadlamudi" }]
keywords = [
    "baseball analytics",
    "data visualization",
    "machine learning",
    "sports analytics",
    "statcast",
    "streamlit",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "joblib>=1.3,<2",
    "matplotlib>=3.8,<4",
    "numpy>=1.26,<3",
    "pandas>=2.1,<3",
    "plotly>=5.20,<7",
    "pyarrow>=14,<24",
    "pybaseball==2.2.7",
    "python-dotenv>=1,<2",
    "scikit-learn>=1.4,<2",
    "scipy>=1.11,<2",
    "shap>=0.49,<0.50",
    "streamlit>=1.60,<2",
    "xgboost>=2.1,<3",
]

[project.optional-dependencies]
dev = [
    "ipykernel>=6.29,<8",
    "nbclient>=0.10,<1",
    "nbconvert>=7.16,<8",
    "nbformat>=5.10,<6",
    "pytest>=8,<9",
    "pytest-cov>=5,<8",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["pitcher_fatigue"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
